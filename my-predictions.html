<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Predictions - Udbhoron '19 Predictor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="main-nav"></div>

  <header class="page-header">
    <h1>My Predictions</h1>
    <p>Track your picks and earned points</p>
  </header>

  <div class="page-content">
    <div id="user-summary" style="text-align:center; margin-bottom:2rem;"></div>
    <div id="predictions-list" class="predictions-list"></div>
  </div>

  <div id="main-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/predictions.js"></script>
  <script src="js/components.js"></script>
  <script>
    Components.initNav('my-predictions');

    if (Auth.requireAuth()) {
      loadPredictions();
    }

    async function loadPredictions() {
      const container = document.getElementById('predictions-list');
      const summary = document.getElementById('user-summary');
      Utils.showLoading(container);

      try {
        const user = await Auth.refreshUser();
        summary.innerHTML = `
          <div class="info-card" style="display:inline-block; min-width:280px;">
            <h3>${Utils.escapeHtml(user.name)}</h3>
            <p>Total Points: <strong style="font-size:1.5rem; color:var(--wc-green);">${user.totalPoints || 0}</strong></p>
          </div>
        `;

        const predictions = await Predictions.getByUser(user.userId);
        if (!predictions.length) {
          container.innerHTML = `
            <p class="empty-state">You haven't made any predictions yet.</p>
            <div style="text-align:center;"><a href="matches.html" class="btn btn-primary">Browse Matches</a></div>
          `;
          return;
        }

        container.innerHTML = predictions.map(p => Predictions.renderPredictionRow(p, p.match)).join('');
      } catch (err) {
        Utils.showError(container, 'Failed to load predictions.');
      }
    }
  </script>
</body>
</html>
